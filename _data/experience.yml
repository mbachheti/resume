# Jobs
# 2023 Summer Internship
- company: Selector Software
  position: Software Engineer Intern
  duration: July 2023 &mdash; August 2023
  summary: Over the course of my 2 months as a software engineer intern at Selector, I completed one project. My project consisted of creating a new service to collect metrics data from Google Cloud Platform and display them in Selector's eexisting dashboard. The service allowed metrics in Google Cloud Platform to be displayed and visualized alongside Selector's other metrics in their dashboard. My project was used by the company after the completion of my internship in a demo of Selector's product to a potential customer. #<ul class="resume-item-list"><li>A project you are proud of</li><li>Another awesome project</li><li>or a team or department you worked with</li></ul>

# 2024 Summer Internship
- company: Selector Software
  position: Software Engineer Intern
  duration: June 2024 &mdash; August 2024
  summary: As my internship project, I created a Slack LLM chatbot able to access content about Selector and answer company-specific questions. I used Retrieval Augmented Generation, allowing the chatbot to refer to a database of documents with information about Selector and its projects to use as a reference before responding to the user-inputted prompt. Using Open AI's Chat GPT API and programming it to refer to the database before generating a response in the form of a Slack message, I created a chatbot with knowledge specific to the company able to answer questions easily without having to manually look through many documents.
